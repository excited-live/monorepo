name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Skills surface check
        run: bash scripts/check-skills.sh
      - name: Workflow helper tests
        run: node --test scripts/pages-domain-recovery.test.mjs
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
