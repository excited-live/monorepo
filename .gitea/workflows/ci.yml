name: CI

on:
  pull_request:
    # labeled/unlabeled matter: a blocking label added after a green run must
    # re-run the merge gate, otherwise a stale success stays valid on the head
    # commit. `edited` is deliberately absent: a body edit is not gate input and
    # would restart the full CI on the single-slot runner for nothing.
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

# One run per pull request (or per pushed ref) at a time. The self-hosted runner
# has a single slot, so a superseded push would otherwise sit in the queue and
# delay every other PR; cancelling it immediately frees that slot. Keyed on the
# PR number so two different PRs never cancel each other, and on github.ref for
# pushes to main, where the newer commit is the one worth testing.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Skills surface check
        run: bash scripts/check-skills.sh
      - name: Workflow helper tests
        run: node --test scripts/pages-domain-recovery.test.mjs
      # Production and prelive deploy config drift used to be caught only inside
      # the deploy workflows, i.e. after merge. A PR that drops a trusted origin
      # is a launch bug (#89), so assert it on every PR too.
      - name: Deploy config guards
        run: node scripts/check-web-production-config.mjs && node scripts/check-prelive-auth-config.mjs
      # #123 B: prelive's discovery documents must describe one identity. This
      # asserts the checked-in origins and that the API still derives PRM from
      # the request host (#116), so the workers.dev/audience split cannot return
      # through a config edit. The deployed half — PRM resource == connected
      # host, and every authorization_servers entry answering JSON rather than
      # HTML/404 — is smoke-prelive.mjs check 4, which runs after both prelive
      # deploys and every six hours. Not duplicated here because prelive serves
      # main: a PR run would assert on a build the PR never changed.
      - name: Prelive MCP discovery guard
        run: node scripts/check-prelive-mcp-discovery.mjs --self-test
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test
  # Merge gate. A SEPARATE job on purpose: the `ci` job id must not change,
  # because 'CI / ci (pull_request)' is main's only required context today.
  # This job publishes 'CI / merge-gate (pull_request)'.
  #
  # The label list comes from the event payload on disk, so the check needs no
  # API token and cannot be bypassed by the merge path forgetting to look at
  # labels. Refusing is the default: unreadable payload, invalid JSON or no
  # pull_request all fail the job.
  merge-gate:
    runs-on: self-hosted
    timeout-minutes: 5
    steps:
      - name: Refuse a pull request that carries a blocking label
        shell: bash
        run: |
          set -euo pipefail
          payload="${GITHUB_EVENT_PATH:-}"
          echo "merge-gate: payload=${payload:-<unset>}"
          if [ -z "$payload" ] || [ ! -r "$payload" ]; then
            echo "::error::merge-gate: no readable event payload; refusing by default"
            exit 1
          fi
          node - "$payload" <<'NODE'
          const fs = require('fs');
          const path = process.argv[2];
          const BLOCKED = new Set(['hold', 'do-not-merge', 'wip', 'blocked']);
          let event;
          try {
            event = JSON.parse(fs.readFileSync(path, 'utf8'));
          } catch (err) {
            console.error('::error::merge-gate: event payload is not valid JSON; refusing by default');
            process.exit(1);
          }
          const pr = event && event.pull_request;
          if (!pr) {
            console.error('::error::merge-gate: event payload has no pull_request; refusing by default');
            process.exit(1);
          }
          const labels = (pr.labels || [])
            .map((label) => String((label && label.name) || '').trim().toLowerCase())
            .filter(Boolean);
          console.log(`merge-gate: action=${event.action || '?'} labels=[${labels.join(',')}]`);
          const blocking = labels.filter((label) => BLOCKED.has(label));
          if (blocking.length > 0) {
            console.error(`::error::merge-gate: blocking label present: ${blocking.join(',')}`);
            process.exit(1);
          }
          console.log('merge-gate: no blocking label');
          NODE
