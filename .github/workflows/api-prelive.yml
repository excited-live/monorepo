name: API Deploy Prelive

# Deploys apps/api (REST + MCP) to the prelive Worker `excited-live-api-prelive`.
#
# Authorization: Prame approved agent deploys of apps/api to PRELIVE (2026-10-23,
# issue #146). Production stays manual and human-only — the top-level
# environment in apps/api/wrangler.toml is deliberately unprovisioned, and this
# workflow only ever passes `--env prelive`.
#
# Migrations are NOT applied here on purpose: the Worker owns them (boot-time
# runner in apps/api/src/db/apply.ts, ledger `d1_migrations`). Two writers on
# one ledger is how a schema ends up half-applied.

on:
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "packages/**"
      - "pnpm-lock.yaml"
      - "turbo.json"
      - "scripts/smoke-prelive.mjs"
      - ".github/workflows/api-prelive.yml"
  workflow_dispatch:

concurrency:
  group: api-prelive
  cancel-in-progress: true

env:
  WRANGLER_VERSION: "4.127.1"

jobs:
  prelive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build api
        run: pnpm exec turbo run build --filter=@excited-live/api

      # Secret first, deploy second: `wrangler secret put` creates the Worker
      # when it does not exist yet, so the first version that ever serves
      # traffic already has BETTER_AUTH_SECRET and never boots in the
      # "unconfigured" dev-passthrough mode (#140).
      - name: Push BETTER_AUTH_SECRET to the Worker
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.PRELIVE_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BETTER_AUTH_SECRET:-}" ]; then
            echo "PRELIVE_BETTER_AUTH_SECRET is not set; refusing to deploy an unauthenticated API." >&2
            exit 1
          fi
          printf '%s' "$BETTER_AUTH_SECRET" |
            npx --yes wrangler@${{ env.WRANGLER_VERSION }} secret put BETTER_AUTH_SECRET --env prelive

      - name: Deploy prelive
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} deploy --env prelive

      # Same two assertions issue #146 calls "done": auth is enforced, no dev
      # passthrough. A deploy that boots unconfigured fails here instead of
      # shipping an open /mcp. Checks 4 and 5 of the shared smoke script: the
      # 401 plus its WWW-Authenticate/resource-metadata chain, and /health.
      - name: Smoke — auth is enforced on the deployed Worker
        run: node scripts/smoke-prelive.mjs --only 4,5 --retries 10 --wait 3

      # A route that never reaches the database proves nothing about auth. Run a
      # real sign-up, then read the new session back with its bearer token (an
      # authenticated get-session hits the database; an anonymous one does not),
      # each with a hard timeout, so a request that hangs (#158: ~3 ms CPU, never
      # answers) fails the deploy instead of shipping. The anonymous 401s above
      # ran first on purpose: that ordering is what used to poison a fresh isolate.
      - name: Smoke — sign-up and session read answer
        run: |
          set -euo pipefail
          api=https://excited-live-api-prelive.preamza02.workers.dev
          fail=0
          for attempt in $(seq 1 3); do
            email="verify+$(date +%s)-${attempt}@example.com"
            signup=$(curl -sS -m 15 -w '\n%{http_code}' -X POST "$api/api/v1/auth/sign-up/email" \
              -H 'content-type: application/json' -H "origin: $api" \
              -d "{\"name\":\"V\",\"email\":\"$email\",\"password\":\"verify-pass-1234\"}" || printf '\nhang')
            signup_code=$(printf '%s' "$signup" | tail -n1)
            token=$(printf '%s' "$signup" | sed '$d' | jq -r '.token // empty' 2>/dev/null || true)
            [ -n "$token" ] && echo "::add-mask::$token"
            session=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' -H "authorization: Bearer $token" \
              "$api/api/v1/auth/get-session" || echo hang)
            echo "attempt $attempt: sign-up -> $signup_code, get-session (bearer) -> $session"
            if [ "$signup_code" != "200" ] || [ -z "$token" ] || [ "$session" != "200" ]; then fail=1; fi
          done
          if [ "$fail" != "0" ]; then
            echo "Better Auth did not answer correctly on the deployed Worker (want 200/200 x3)" >&2
            exit 1
          fi
