name: PR Checks

# Lint (whole repo) + unit tests ONLY for packages/apps affected by a PR.
#
# Affected = changed in this PR plus everything that depends on them
# (turbo's dependency graph, `--filter=...[base-sha]`). No hardcoded path
# mapping: add a package with a `test` script and it's picked up
# automatically; packages without tests (e.g. apps/webapp today) are
# skipped. Root-level changes (configs, lockfile, turbo.json) trigger all
# packages with tests.

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: pr-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect affected packages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      packages: ${{ steps.affected.outputs.packages }}
      has-tests: ${{ steps.affected.outputs.has-tests }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history + merge-base so turbo can diff against the real
          # fork point, not the merge commit on the PR branch.
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # turbo comes from devDependencies — required for the affected-set
      # computation below (pnpm exec prints "undefined" if the binary is
      # missing, which previously surfaced as a confusing JSON.parse error).
      - run: pnpm install --frozen-lockfile

      - name: Compute affected packages
        id: affected
        run: |
          BASE_SHA="$(git merge-base origin/${{ github.base_ref }} HEAD)"
          echo "Diff base: $BASE_SHA"

          # Dry-run the test task filtered to affected packages:
          # `...[sha]` = changed since sha + all transitive dependents.
          pnpm exec turbo run test --filter="...[$BASE_SHA]" --dry=json \
            | node -e '
              let raw = "";
              process.stdin.on("data", (c) => (raw += c));
              process.stdin.on("end", () => {
                const plan = JSON.parse(raw);
                // Only packages with a REAL test script (turbo emits
                // command "<NONEXISTENT>" for packages without one).
                const real = plan.tasks.filter((t) => t.command !== "<NONEXISTENT>");
                const names = [...new Set(real.map((t) => t.package))].sort();
                console.log(`Affected packages with tests: ${names.join(", ") || "(none)"}`);
                require("fs").appendFileSync(
                  process.env.GITHUB_OUTPUT,
                  `packages=${JSON.stringify(names)}\n` +
                  `has-tests=${names.length > 0}\n`,
                );
              });
            '

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Whole-repo lint (flat eslint.config.mjs). Not affected-filtered:
      # lint is cheap and config/lockfile changes touch every file.
      # --max-warnings=0 keeps the warning budget at zero so new warnings
      # can't accumulate as invisible debt.
      - run: pnpm lint --max-warnings=0

  test:
    name: ${{ matrix.task }}
    needs: detect
    if: needs.detect.outputs.has-tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        task: ${{ fromJson(needs.detect.outputs.packages) }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Run ONLY this package's test task. Turbo still builds upstream
      # dependencies first (test dependsOn ^build) and caches them.
      # Package name arrives via env (not direct interpolation) so shell
      # metacharacters in a PR-supplied package.json name can't inject.
      - name: Test ${{ matrix.task }}
        env:
          AFFECTED_PACKAGE: ${{ matrix.task }}
        run: pnpm exec turbo run test --filter="$AFFECTED_PACKAGE" --output-logs=errors-only

  # apps/api now has a test script, so the matrix above picks it up when the
  # package (or its deps) change. Gate it explicitly as well: typecheck + build
  # + tests must pass even for changes the affected-set computation cannot see
  # (lockfile, root config), and this job is the api-specific CI contract.
  api-gate:
    name: api (typecheck + build + test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run typecheck build test --filter=@excited-live/api

  # Helper scripts the workflows execute have no package and no dependencies, so
  # turbo never sees them. They are unit-tested with node:test here, which makes
  # a workflow-only change provable without a deploy.
  scripts:
    name: workflow helper scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: node --test scripts/pages-domain-recovery.test.mjs

  # Single required status check for branch protection. The job name must
  # match the required context on `main` ("PR gate"). Fails if any dependency
  # failed; a skipped `test` job (no affected packages with tests) counts as
  # a pass. Skipped when the run itself is cancelled (concurrency supersedes).
  gate:
    name: PR gate
    needs: [detect, lint, test, api-gate, scripts]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Aggregate dependency results
        run: |
          for r in \
            "${{ needs.detect.result }}" \
            "${{ needs.lint.result }}" \
            "${{ needs.test.result }}" \
            "${{ needs.api-gate.result }}" \
            "${{ needs.scripts.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::dependency result: $r"; exit 1 ;;
            esac
          done
          echo "All gated jobs passed."
