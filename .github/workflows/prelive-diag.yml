name: Prelive Diagnose

# Temporary: capture the prelive Pages runtime exception that turns every
# request into Cloudflare error 1101. Manual dispatch only; delete after #154.
on:
  workflow_dispatch:

env:
  WRANGLER_VERSION: "4.127.1"
  PRELIVE_PROJECT: excited-live-prelive

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tail the live prelive deployment while requesting it
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deployment tail \
            --project-name "$PRELIVE_PROJECT" --format pretty > /tmp/tail.log 2>&1 &
          tail_pid=$!
          sleep 12
          echo "--- GET /"
          curl -s -m 20 -o /dev/null -w 'status %{http_code}\n' https://prelive.excited.live/
          echo "--- GET /api/auth/ok"
          curl -s -m 20 -o /dev/null -w 'status %{http_code}\n' https://prelive.excited.live/api/auth/ok
          echo "--- GET metadata"
          curl -s -m 20 -o /dev/null -w 'status %{http_code}\n' https://prelive.excited.live/api/auth/.well-known/oauth-authorization-server
          sleep 15
          kill "$tail_pid" 2>/dev/null || true
          sleep 2
          echo "--- tail output"
          cat /tmp/tail.log || true
