name: Prelive Smoke

# Continuous, read-only proof that the deployed prelive stack still works:
# the webapp (Pages) is the MCP authorization server, the API Worker is the
# protected resource, and the two discovery documents agree. All endpoints are
# public, so this needs no secrets.
#
# It runs on a schedule because prelive changes underneath us (Secrets, bindings
# and Pages config can drift without a commit), and after each deploy completes
# so a broken rollout is caught even when the deploy job's own smoke passed
# before propagation. It is not wired into PR workflows on purpose: prelive
# serves main, so a PR run would assert on a build the PR never touched. PR-time
# coverage stays check-prelive-auth-config.mjs and pr-tests.yml.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  workflow_run:
    # IAM Deploy Production is here on purpose (#185): production iam moves only
    # through a manual dispatch, so without this entry the guard that watches
    # iam.excited.live would not look again until the six-hour cron — the exact
    # blind spot that let a prelive bundle sit on the prod host for a day.
    workflows: ["Deploy Prelive", "API Deploy Prelive", "IAM Deploy Production"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: prelive-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # workflow_run fires for failed deploys too; a failed deploy already reports
    # itself, so only the deploy that succeeded is re-checked. Scheduled and
    # manual runs always run.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # No pnpm install: the script only uses node: built-ins and global fetch.
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Smoke — prelive authorization server and protected resource
        run: node scripts/smoke-prelive.mjs --retries 3 --wait 10
      # The prelive workflow used to deploy to `excited-live-iam` (the project that
      # owns iam.excited.live) and did it three times on 2026-10-25, so production
      # served a prelive bundle. Build-time guards cannot see that: the bundle was
      # valid, it was deployed to the wrong project. This reads the host itself,
      # on a schedule and after every Deploy Prelive, and fails on any #88 marker.
      - name: Guard — production iam host serves a production bundle (#88 #93)
        run: node scripts/check-iam-live-bundle.mjs --retries 3 --wait 10
      # #99 and #100 shipped on the prod landing while checks 1-5 were green: the
      # dead MCP host is in the landing's copy-paste snippet and /llms.txt served
      # the landing HTML. Neither surface is touched by the prelive checks, so run
      # the landing check explicitly here (it is off in the default --only list so
      # a prelive deploy is not failed by a prod landing regression).
      - name: Smoke — landing entry points, advertised MCP host and /llms.txt (#99 #100)
        run: node scripts/smoke-prelive.mjs --only 6 --retries 3 --wait 10
