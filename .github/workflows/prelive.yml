name: Deploy Prelive

on:
  push:
    branches: [main]

env:
  WRANGLER_VERSION: "4.127.1"
  PRELIVE_PROJECT: excited-live-prelive
  IAM_PROJECT: excited-live-iam
  IAM_DOMAIN: iam.excited.live
  # The single API, inlined by Vite at build time. `apps/iam/src/lib/env.ts`
  # falls back to http://localhost:8000, so leaving this unset ships a bundle
  # that only works on a developer's machine — the same silent-misconfiguration
  # failure as the webapp's missing BACKEND_API_URL (#26).
  IAM_API_URL: https://excited-live-api-prelive.preamza02.workers.dev
  # The OAuth authorization server for iam is the webapp's Better Auth cookies
  # mount; iam only resumes flows there and never proxies through it.
  IAM_AUTH_SERVER_URL: https://prelive.excited.live

jobs:
  # iam.excited.live: a static client SPA with no server and no bindings, so it
  # only needs a build, a Pages project, a custom domain, and a deploy. Kept in
  # the same workflow as the webapp because both talk to the prelive API: a
  # merge that changes the API should redeploy both, in one run and one place.
  iam:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Build iam
        working-directory: apps/iam
        env:
          VITE_API_URL: ${{ env.IAM_API_URL }}
          VITE_AUTH_SERVER_URL: ${{ env.IAM_AUTH_SERVER_URL }}
          VITE_ENV_LABEL: prelive
        run: pnpm --filter @excited-live/iam^... build && pnpm build

      # Prove the artifact before spending a deployment on it. Vite inlines
      # VITE_* at build, so a missing value is invisible in CI and fatal in the
      # browser; and without dist/_redirects every deep link 404s on refresh.
      # (Check the positive only: src/lib/env.ts keeps "http://localhost:8000"
      # as its code-level fallback, so that string is in every build.)
      - name: Check the iam build targets the prelive API
        working-directory: apps/iam
        env:
          VITE_API_URL: ${{ env.IAM_API_URL }}
        run: |
          set -euo pipefail
          if ! grep -rq "$IAM_API_URL" dist/assets; then
            echo "::error::the built bundle never mentions $IAM_API_URL — VITE_API_URL was not inlined, so iam would talk to localhost. Nothing was deployed."
            exit 1
          fi
          if [ ! -f dist/_redirects ]; then
            echo "::error::dist/_redirects is missing; client routes would 404 on a hard refresh. Nothing was deployed."
            exit 1
          fi
          echo "Bundle targets $IAM_API_URL and ships the SPA fallback."

      # Idempotent provisioning, and no blanket `|| true`: a 403 here means the
      # token lacks Pages:Edit, which must fail now rather than at the deploy.
      - name: Ensure iam Pages project and custom domain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"

          show() { jq -r '.errors[]? | "CF error \(.code): \(.message)"' /tmp/cf.json 2>/dev/null || cat /tmp/cf.json; }

          code=$(curl -sS -m 30 -o /tmp/cf.json -w '%{http_code}' -H "$auth" "$api/$IAM_PROJECT")
          if [ "$code" = "404" ]; then
            code=$(curl -sS -m 30 -o /tmp/cf.json -w '%{http_code}' -X POST "$api" \
              -H "$auth" -H 'content-type: application/json' \
              --data "$(jq -cn --arg name "$IAM_PROJECT" '{name:$name, production_branch:"main"}')")
            if [ "$code" != "200" ]; then
              echo "::error::creating Pages project $IAM_PROJECT returned $code"
              show
              exit 1
            fi
            echo "Created Pages project $IAM_PROJECT."
          elif [ "$code" != "200" ]; then
            echo "::error::reading Pages project $IAM_PROJECT returned $code (needs a token with Pages:Edit)"
            show
            exit 1
          else
            echo "Pages project $IAM_PROJECT already exists."
          fi

          code=$(curl -sS -m 30 -o /tmp/cf.json -w '%{http_code}' -X POST "$api/$IAM_PROJECT/domains" \
            -H "$auth" -H 'content-type: application/json' \
            --data "$(jq -cn --arg name "$IAM_DOMAIN" '{name:$name}')")
          case "$code" in
            200|201) echo "Attached $IAM_DOMAIN to $IAM_PROJECT (proxied CNAME and certificate managed by Cloudflare)." ;;
            409) echo "$IAM_DOMAIN is already attached to $IAM_PROJECT." ;;
            *)
              echo "::error::attaching $IAM_DOMAIN returned $code"
              show
              exit 1
              ;;
          esac

      - name: Deploy iam
        working-directory: apps/iam
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist --project-name="$IAM_PROJECT" --branch=main --commit-dirty=true

      # The only proof that matters: the hostname serves the SPA shell, and a
      # client route returns that same shell instead of a 404.
      - name: Smoke — iam SPA on its custom domain
        run: |
          set -euo pipefail
          base="https://$IAM_DOMAIN"
          root=""
          for attempt in $(seq 1 18); do
            root=$(curl -sS -m 20 -o /tmp/root.html -w '%{http_code}' "$base/" || true)
            [ "$root" = "200" ] && break
            echo "attempt $attempt: / -> $root"
            sleep 10
          done
          echo "/ -> $root"
          if [ "$root" != "200" ]; then
            echo "::error::$base/ returned $root (first custom-domain attach can take minutes for DNS + certificate)"
            exit 1
          fi
          if ! grep -qi '<div id="root"' /tmp/root.html; then
            echo "::error::$base/ did not return the SPA shell"
            head -20 /tmp/root.html
            exit 1
          fi

          deep=$(curl -sS -m 20 -o /tmp/deep.html -w '%{http_code}' "$base/data" || true)
          echo "/data -> $deep"
          if [ "$deep" != "200" ]; then
            echo "::error::$base/data returned $deep — the SPA fallback (_redirects) is not installed"
            exit 1
          fi
          cmp -s /tmp/root.html /tmp/deep.html || echo "::warning::/data is not byte-identical to / — check the fallback"

      - name: Show the iam deployment URL
        if: always()
        run: |
          echo "iam: https://$IAM_DOMAIN (project $IAM_PROJECT)"

  prelive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # The webapp is the MCP authorization server for prelive and the API is
      # the protected resource. If they disagree on the D1 database or on the
      # issuer/resource origins, OAuth fails only at runtime (#154), so fail
      # before deploying.
      - name: Check prelive auth configuration
        run: node scripts/check-prelive-auth-config.mjs

      - name: Build webapp
        working-directory: apps/webapp
        env:
          VITE_API_MODE: live
        run: pnpm --filter @excited-live/webapp^... build && pnpm build

      - name: Ensure prelive Pages project
        working-directory: apps/webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create "$PRELIVE_PROJECT" --production-branch main || true

      # `wrangler pages deploy` uploads a configuration *hash*, not the bindings
      # or vars, so a wrangler.toml alone never binds D1 on a direct-upload
      # project. Apply the prelive deployment config here: the shared D1
      # binding, the two auth vars, compatibility, and the hash of the config
      # file the deploy step will install (a stale hash is how a deployment
      # ends up rejected as out of sync). PATCH merges by key, so the
      # BETTER_AUTH_SECRET pushed next is preserved.
      - name: Apply prelive Pages bindings and vars
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          body=$(node scripts/check-prelive-auth-config.mjs --json)
          echo "Patching $PRELIVE_PROJECT deployment_configs.production:"
          printf '%s' "$body" | jq -c '.deployment_configs.production | {d1_databases, env_vars, compatibility_date, compatibility_flags, wrangler_config_hash}'
          response=$(curl -sS -m 30 -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PRELIVE_PROJECT" \
            -H "authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'content-type: application/json' \
            --data "$body" \
            -w '\n%{http_code}')
          status=$(printf '%s' "$response" | tail -n1)
          payload=$(printf '%s' "$response" | sed '$d')
          printf '%s\n' "$payload" | jq -r 'if .success then "Project updated: \(.result.name)" else (.errors[]? | "CF error \(.code): \(.message)") end' || printf '%s\n' "$payload"
          if [ "$status" != "200" ]; then
            echo "::error::PATCH on Pages project $PRELIVE_PROJECT returned $status (needs a token with Pages:Edit). Nothing was deployed."
            exit 1
          fi

      # Same value api-prelive.yml pushes to the Worker: the webapp (cookies
      # mount) signs sessions and issues OAuth/JWKS material, the API (tokens
      # mount + /mcp resource server) verifies it. Different values mean every
      # prelive session and access token is invalid.
      #
      # Secret first, deploy second, so the first deployment that serves traffic
      # already has an authorization server instead of the "not configured in
      # this environment" 503.
      - name: Push BETTER_AUTH_SECRET to the prelive Pages project
        working-directory: apps/webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BETTER_AUTH_SECRET: ${{ secrets.PRELIVE_BETTER_AUTH_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${BETTER_AUTH_SECRET:-}" ]; then
            echo "PRELIVE_BETTER_AUTH_SECRET is not set; refusing to deploy a prelive webapp without an authorization server." >&2
            exit 1
          fi
          printf '%s' "$BETTER_AUTH_SECRET" |
            npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages secret put BETTER_AUTH_SECRET --project-name "$PRELIVE_PROJECT"

      # Pages has no `--config` flag and always reads the wrangler.toml of the
      # working directory — which must be apps/webapp so Pages bundles
      # functions/ (the SSR entry). Install the prelive config for this job
      # only; the checked-in apps/webapp/wrangler.toml stays the
      # production/preview config.
      - name: Deploy prelive
        working-directory: apps/webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cp wrangler.prelive.toml wrangler.toml
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name="$PRELIVE_PROJECT" --branch=main --commit-dirty=true

      # Proof, not a conclusion: the four assertions in #154, with the raw
      # responses echoed so a failure shows what the deployment returned.
      # Retried because a fresh Pages deployment takes a few seconds to
      # propagate.
      - name: Smoke — prelive MCP authorization server
        run: |
          set -euo pipefail
          issuer=https://prelive.excited.live/api/auth
          api=https://excited-live-api-prelive.preamza02.workers.dev
          reg_body='{"client_name":"prelive-ci-smoke","redirect_uris":["https://example.com/callback"],"grant_types":["authorization_code","refresh_token"],"response_types":["code"],"token_endpoint_auth_method":"none","scope":"openid profile email offline_access"}'

          meta_code=000
          ok_code=000
          for attempt in $(seq 1 10); do
            meta_code=$(curl -sS -m 20 -o /tmp/meta.json -w '%{http_code}' "$issuer/.well-known/oauth-authorization-server" || echo 000)
            ok_code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' "$issuer/ok" || echo 000)
            echo "attempt $attempt: metadata -> $meta_code, /ok -> $ok_code"
            if [ "$meta_code" = "200" ] && [ "$ok_code" = "200" ]; then break; fi
            sleep 5
          done

          echo "--- GET $issuer/.well-known/oauth-authorization-server ($meta_code)"
          cat /tmp/meta.json; echo
          echo "--- GET $issuer/ok ($ok_code)"
          ok_body=$(curl -sS -m 20 "$issuer/ok" || true); echo "$ok_body"

          reg=$(curl -sS -m 20 -w '\n%{http_code}' -X POST "$issuer/oauth2/register" -H 'content-type: application/json' -d "$reg_body" || printf '\n000')
          reg_code=$(printf '%s' "$reg" | tail -n1)
          reg_json=$(printf '%s' "$reg" | sed '$d')
          echo "--- POST $issuer/oauth2/register ($reg_code)"
          echo "$reg_json"

          mcp_code=$(curl -sS -m 20 -o /dev/null -w '%{http_code}' -X POST "$api/mcp" || echo 000)
          echo "--- POST $api/mcp without a token ($mcp_code)"

          fail=0
          [ "$meta_code" = "200" ] || { echo "::error::authorization-server metadata is $meta_code, want 200"; fail=1; }
          [ "$ok_code" = "200" ] || { echo "::error::/api/auth/ok is $ok_code, want 200"; fail=1; }
          [ "$reg_code" = "200" ] || [ "$reg_code" = "201" ] || { echo "::error::dynamic client registration is $reg_code, want 200/201"; fail=1; }
          [ "$mcp_code" = "401" ] || { echo "::error::POST /mcp without a token is $mcp_code, want 401"; fail=1; }

          chosen_issuer=$(jq -r '.issuer // empty' /tmp/meta.json)
          client_id=$(printf '%s' "$reg_json" | jq -r '.client_id // empty')
          echo "issuer=$chosen_issuer client_id=$client_id"
          [ "$chosen_issuer" = "$issuer" ] || { echo "::error::metadata issuer is '$chosen_issuer', want '$issuer'"; fail=1; }
          [ -n "$client_id" ] || { echo "::error::registration returned no client_id"; fail=1; }
          exit "$fail"

      # A 1101 page hides the cause, and the smoke test only says which
      # assertion failed. Tail the live deployment while requesting the same
      # URLs so the Worker exception itself lands in the log. ~30s, only on
      # failure.
      - name: Capture prelive runtime exception
        if: failure()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -uo pipefail
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deployment tail \
            --project-name "$PRELIVE_PROJECT" --format pretty > /tmp/tail.log 2>&1 &
          tail_pid=$!
          sleep 10
          curl -s -m 20 -o /dev/null -w '/ -> %{http_code}\n' https://prelive.excited.live/ || true
          curl -s -m 20 -o /dev/null -w '/api/auth/ok -> %{http_code}\n' https://prelive.excited.live/api/auth/ok || true
          sleep 12
          kill "$tail_pid" 2>/dev/null || true
          sleep 2
          echo "--- pages tail"
          cat /tmp/tail.log || true
