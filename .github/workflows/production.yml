name: Deploy Production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROD to confirm production deploy"
        required: true
        default: ""

env:
  WRANGLER_VERSION: "4.127.1"

jobs:
  production:
    # Two gates: the typed confirmation, and the dispatched ref. A run started
    # from any branch other than main never starts a job.
    if: github.event.inputs.confirm == 'PROD' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build webapp
        working-directory: apps/webapp
        env:
          VITE_API_MODE: live
        run: pnpm --filter @excited-live/webapp^... build && pnpm build
      - name: Deploy production
        working-directory: apps/webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages project create excited-live --production-branch main || true
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name=excited-live --branch=main --commit-dirty=true