name: Deploy Production

# Manual, PROD-gated redeploy of the production webapp to the Pages project
# `excited-live-web`.
#
# Normal path is a push to `main` (.github/workflows/webapp-production.yml).
# This workflow exists for a deliberate re-deploy of the current `main` without
# a new commit, and it shares the same concurrency group so the two can never
# interleave.
#
# It must never target the Pages project `excited-live`: that project serves a
# WorkOS AuthKit app (307 to api.workos.com) that is not ours to overwrite. It
# did target it until 2026-10-25.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type PROD to confirm production deploy"
        required: true
        default: ""

env:
  WRANGLER_VERSION: "4.127.1"
  WEB_PROJECT: excited-live-web

concurrency:
  group: webapp-production
  cancel-in-progress: false

jobs:
  production:
    # Two gates: the typed confirmation, and the dispatched ref. A run started
    # from any branch other than main never starts a job.
    if: github.event.inputs.confirm == 'PROD' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check production webapp configuration
        run: node scripts/check-web-production-config.mjs
      - name: Build webapp
        working-directory: apps/webapp
        env:
          VITE_API_MODE: live
        run: pnpm --filter @excited-live/webapp^... build && pnpm build
      - name: Deploy production
        working-directory: apps/webapp
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # Install the production-web config for this job only, exactly as
          # webapp-production.yml does, so the config hash matches the project.
          cp wrangler.web.toml wrangler.toml
          body=$(node ../../scripts/check-web-production-config.mjs --json)
          response=$(curl -sS -m 30 -X PATCH \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$WEB_PROJECT" \
            -H "authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H 'content-type: application/json' \
            --data "$body" \
            -w '\n%{http_code}')
          status=$(printf '%s' "$response" | tail -n1)
          printf '%s\n' "$response" | sed '$d' | jq -r 'if .success then "Project updated: \(.result.name)" else (.errors[]? | "CF error \(.code): \(.message)") end' || true
          if [ "$status" != "200" ]; then
            echo "::error::PATCH on Pages project $WEB_PROJECT returned $status. Nothing was deployed."
            exit 1
          fi
          npx --yes wrangler@${{ env.WRANGLER_VERSION }} pages deploy dist/client --project-name="$WEB_PROJECT" --branch=main --commit-dirty=true
