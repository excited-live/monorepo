name: Component Screenshot Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "apps/webapp/**"
      - "packages/design-system/**"
      - ".github/workflows/screenshot-tests.yml"
  workflow_dispatch:

concurrency:
  group: screenshot-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-screenshots:
    name: Verify Component Screenshots
    # Official Playwright image: font and text rendering match the environment
    # the committed baselines were captured in. Bare ubuntu-latest drifts and
    # produces false diffs, especially on transparent (omitBackground) edges.
    runs-on: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.12.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Chromium matches the pinned Playwright version
        run: pnpm --filter @excited-live/webapp exec playwright install chromium

      - name: Run visual regression tests
        run: pnpm --filter @excited-live/webapp test:visual
        env:
          CI: 1

      - name: Upload visual test report & diffs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            apps/webapp/playwright-report/
            apps/webapp/test-results/
          retention-days: 7
