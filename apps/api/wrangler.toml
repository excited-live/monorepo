# Cloudflare Workers config for the excited.live API.
#
# Two environments:
#   * top level     -> production (`excited-live-api`).
#   * [env.prelive] -> `excited-live-api-prelive`, deployed by
#     `.github/workflows/api-prelive.yml` on every push to `main` that touches
#     the API (issue #146).
#
# Runtime resolution (src/db/index.ts):
#   1. env.DB (this D1 binding)  -> D1
#   2. otherwise                 -> local SQLite file via node:sqlite

name = "excited-live-api"
main = "dist/worker.js"
compatibility_date = "2026-08-30"

# Required, not cosmetic: the app reads secrets and vars through `process.env`
# (src/lib/auth.ts:30,84), which Workers backfills from the Worker's bindings
# only when nodejs_compat is on. Without it BETTER_AUTH_SECRET is invisible,
# auth reports "unconfigured", and /mcp falls back to dev passthrough on a
# public URL (#140).
compatibility_flags = ["nodejs_compat"]

# EXCITED_WEBAPP_URL is the OAuth authorization server this API advertises in
# /.well-known/oauth-protected-resource: issuer = <this>/api/auth, and the only
# mount that can complete a browser MCP OAuth flow (sign-in, consent, device).
# It must equal BETTER_AUTH_URL in apps/webapp/wrangler.web.toml —
# scripts/check-web-production-config.mjs fails CI when the two drift, because a
# mismatch breaks every connector at the token step, not at discovery.
# Since 2026-10-25 that origin is the webapp's custom domain, auth.excited.live.
vars = { BETTER_AUTH_URL = "https://api.excited.live", EXCITED_WEBAPP_URL = "https://auth.excited.live", BETTER_AUTH_TRUSTED_ORIGINS = "https://auth.excited.live,https://excited-live-web.pages.dev,https://excited.live" }

routes = [
	{ pattern = "api.excited.live", custom_domain = true }
]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "excited-live-api-production"
database_id = "90bd930e-8bfe-49a4-b58c-b44531c20902"
migrations_dir = "migrations"

# ---------------------------------------------------------------------------
# prelive — the only environment CI deploys.
#
# Migrations have ONE owner here: the Worker's boot-time runner
# (src/db/apply.ts, ledger `d1_migrations`, the same ledger
# `wrangler d1 migrations apply` uses). CI never runs migrations, so the deploy
# token does not need D1 permission.
#
# The runner reads the ledger first and only issues DDL when the table is
# missing. That ordering is load-bearing: the original `CREATE TABLE IF NOT
# EXISTS` on every cold start was a schema write on a hot request path, and on
# D1 it deadlocked prelive traffic on 2026-10-23 — authenticated requests hung
# for the full wall clock at ~3 ms CPU, roughly half the time, until the isolate
# died. Steady state is now one SELECT per isolate.
#
# BETTER_AUTH_URL is the Worker's own origin (the app appends /api/v1/auth),
# EXCITED_WEBAPP_URL is the issuer the MCP OAuth surface advertises, and
# BETTER_AUTH_TRUSTED_ORIGINS is what lets the prelive webapp call this API
# cross-origin from a browser.
# ---------------------------------------------------------------------------
[env.prelive]
name = "excited-live-api-prelive"
# No routes on purpose: Wrangler environments INHERIT the top-level `routes`,
# so without this line `wrangler deploy --env prelive` reassigns the production
# custom domain api.excited.live from `excited-live-api` to this Worker (it did
# exactly that on 2026-10-25 and production started serving prelive vars and
# the prelive D1 database). An explicit empty list stops the inheritance.
routes = []
vars = { BETTER_AUTH_URL = "https://excited-live-api-prelive.preamza02.workers.dev", EXCITED_WEBAPP_URL = "https://prelive.excited.live", BETTER_AUTH_TRUSTED_ORIGINS = "https://prelive.excited.live" }

# Workers Logs: console output and request traces land in the dashboard and the
# telemetry API. Added for #158, when a hang left no events to read.
[env.prelive.observability]
enabled = true

[[env.prelive.d1_databases]]
binding = "DB"
database_name = "excited-live-api-prelive"
# Created 2026-10-23 (APAC). Shared with the webapp prelive later (#139): both
# mounts must point at this one database and use one BETTER_AUTH_SECRET.
database_id = "f7bd3f26-5296-4832-96a3-1cbb01046112"
migrations_dir = "migrations"
